name: Python app build

on:
  workflow_call:
    inputs:
      version:
        description: >
          The version to release: builds onefile executables, signs the Windows one and attaches them to the release
          v<version>. Without it, debug builds become artifacts.
        type: string
        default: ''
      ref:
        description: The ref to build, such as the commit that bump-version gives; the triggering commit when empty.
        type: string
        default: ''
      builder:
        description: nuitka, or pyinstaller for an app that Nuitka does not build well.
        type: string
        default: nuitka
      include-package:
        description: For Nuitka, a package that it must include although no import shows it, such as rich._unicode_data.
        type: string
        default: ''
      copy-metadata:
        description: For PyInstaller, a package whose metadata the app reads at run time, such as readchar.
        type: string
        default: ''

jobs:
  build:
    name: Build for ${{ matrix.osname }}
    runs-on: ${{ matrix.os }}
    # The signing machine never signs a file uploaded longer ago, so the two change together.
    timeout-minutes: 150
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            osname: Linux
          - os: macos-latest
            osname: macOS
          - os: windows-latest
            osname: Windows
            extension: .exe

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ steps.python.outputs.python-path }}

      - name: Install the app
        run: uv sync --locked --no-dev

      - id: app
        name: Name the build
        shell: bash
        env:
          REPOSITORY: ${{ github.event.repository.name }}
          VERSION: ${{ inputs.version }}
          OS: ${{ matrix.osname }}
        run: |
          {
            echo "package=$(tr "[:upper:]" "[:lower:]" <<< "$REPOSITORY")"
            echo "year=$(date +%Y)"
            if [[ -n "$VERSION" ]]; then
              echo "name=${REPOSITORY}_v${VERSION}_$OS"
              echo "product=$REPOSITORY"
              echo "description=$REPOSITORY for $OS (version $VERSION)"
            else
              echo "name=${REPOSITORY}_${OS}_Debug"
              echo "product=$REPOSITORY (Debug build - $GITHUB_SHA)"
              echo "description=Debug build of $REPOSITORY for $OS (commit $GITHUB_SHA)"
            fi
          } >> "$GITHUB_OUTPUT"

      # Only for debug builds: a release builds from scratch, as setup-uv does with its own cache, so that no cached
      # object can find its way into it.
      - name: Install ccache
        if: ${{ inputs.builder == 'nuitka' && !inputs.version && runner.os != 'Windows' }}
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then sudo apt-get install -y ccache; else brew install ccache; fi

      - name: Restore the Nuitka cache
        if: ${{ inputs.builder == 'nuitka' && !inputs.version }}
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/nuitka
          key: nuitka-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ github.sha }}
          restore-keys: nuitka-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-

      - name: Build with Nuitka
        if: ${{ inputs.builder == 'nuitka' }}
        shell: bash
        env:
          NUITKA_CACHE_DIR: ${{ runner.temp }}/nuitka
          MODE: ${{ inputs.version && 'onefile' || 'standalone' }}
          PACKAGE: ${{ steps.app.outputs.package }}
          FILENAME: ${{ steps.app.outputs.name }}${{ matrix.extension }}
          OWNER: ${{ github.repository_owner }}
          PRODUCT: ${{ steps.app.outputs.product }}
          DESCRIPTION: ${{ steps.app.outputs.description }}
          VERSION: ${{ inputs.version || '0.0.0.0' }}
          YEAR: ${{ steps.app.outputs.year }}
          INCLUDE_PACKAGE: ${{ inputs.include-package }}
        run: |
          options=(--"$MODE" --assume-yes-for-downloads --output-dir=build --output-filename="$FILENAME")
          options+=(--company-name="$OWNER" --product-name="$PRODUCT" --file-description="$DESCRIPTION")
          options+=(--file-version="$VERSION" --product-version="$VERSION" --copyright="Copyright (c) $YEAR $OWNER")
          if [[ -n "$INCLUDE_PACKAGE" ]]; then options+=(--include-package="$INCLUDE_PACKAGE"); fi
          uv run --locked --no-dev --with nuitka python -m nuitka "${options[@]}" "src/$PACKAGE"

      # PyInstaller takes the version resource of a Windows executable as a Python expression in a file.
      - name: Describe the Windows executable
        if: ${{ inputs.builder == 'pyinstaller' && runner.os == 'Windows' }}
        shell: python
        env:
          VERSION: ${{ inputs.version }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.event.repository.name }}
          NAME: ${{ steps.app.outputs.name }}
          PRODUCT: ${{ steps.app.outputs.product }}
          DESCRIPTION: ${{ steps.app.outputs.description }}
          YEAR: ${{ steps.app.outputs.year }}
        run: |
          import os
          from pathlib import Path

          numbers = (*map(int, (os.environ["VERSION"] or "0").split(".")), 0, 0, 0, 0)[:4]
          version = ".".join(map(str, numbers))
          strings = {
              "CompanyName": os.environ["OWNER"],
              "FileDescription": os.environ["DESCRIPTION"],
              "FileVersion": version,
              "InternalName": os.environ["REPOSITORY"],
              "LegalCopyright": f"Copyright (c) {os.environ['YEAR']} {os.environ['OWNER']}",
              "OriginalFilename": f"{os.environ['NAME']}.exe",
              "ProductName": os.environ["PRODUCT"],
              "ProductVersion": version,
          }
          structs = ", ".join(f"StringStruct({key!r}, {value!r})" for key, value in strings.items())
          Path("version_info.txt").write_text(
              f"VSVersionInfo(ffi=FixedFileInfo(filevers={numbers}, prodvers={numbers}), kids=["
              f"StringFileInfo([StringTable('040904B0', [{structs}])]), "
              "VarFileInfo([VarStruct('Translation', [1033, 1200])])])\n",
              encoding="utf-8",
          )

      - name: Build with PyInstaller
        if: ${{ inputs.builder == 'pyinstaller' }}
        shell: bash
        env:
          PACKAGE: ${{ steps.app.outputs.package }}
          NAME: ${{ steps.app.outputs.name }}
          DIST: ${{ inputs.version && 'build' || format('build/{0}.dist', steps.app.outputs.package) }}
          COPY_METADATA: ${{ inputs.copy-metadata }}
          OWNER: ${{ github.repository_owner }}
        run: |
          options=(--noconfirm --onefile --icon NONE --name "$NAME" --distpath "$DIST")
          if [[ -n "$COPY_METADATA" ]]; then options+=(--copy-metadata "$COPY_METADATA"); fi
          if [[ -f version_info.txt ]]; then options+=(--version-file version_info.txt); fi
          if [[ "$RUNNER_OS" == macOS ]]; then options+=(--osx-bundle-identifier "com.$OWNER.$PACKAGE"); fi
          uv run --locked --no-dev --with pyinstaller pyinstaller "${options[@]}" "src/$PACKAGE/__main__.py"

      - name: Keep the debug build
        if: ${{ !inputs.version }}
        uses: actions/upload-artifact@v7
        with:
          name: Debug_${{ matrix.osname }}
          path: build/${{ steps.app.outputs.package }}.dist
          include-hidden-files: true

      # Before the signing wait, so that a package without a licence text stops the release at once.
      - name: Write the third-party notices
        if: ${{ inputs.version }}
        shell: bash
        env:
          NOTICES: build/${{ steps.app.outputs.name }}_THIRD-PARTY-NOTICES.md
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          OS: ${{ matrix.osname }}
          PACKAGE: ${{ steps.app.outputs.package }}
        run: |
          uv run --locked --no-dev python - <<'PY'
          import os
          import platform
          import re
          import sys
          from importlib import metadata
          from pathlib import Path

          repository, version = os.environ["REPOSITORY"], os.environ["VERSION"]
          name = repository.split("/")[1]
          # Windows keeps the licence beside python.exe, the other systems in the standard library's folder.
          python_licence = next(
              path
              for path in (Path(os.__file__).parent / "LICENSE.txt", Path(sys.base_prefix) / "LICENSE.txt")
              if path.is_file()
          )
          components = [("Python", platform.python_version(), "PSF-2.0", "https://www.python.org/downloads/source/")]
          texts = [(name, "LICENSE.md", Path("LICENSE.md")), ("Python", "LICENSE.txt", python_licence)]

          packages = {re.sub("[-_.]+", "-", item.name).lower(): item for item in metadata.distributions()}
          for canonical, package in sorted(packages.items()):
              if canonical == os.environ["PACKAGE"]:
                  continue
              files = [
                  file
                  for file in package.files or []
                  if ".dist-info/" in file.as_posix()
                  and ("/licenses/" in file.as_posix() or re.match("licen[cs]e|copying|notice", file.name, re.I))
              ]
              if not files:
                  sys.exit(f"{package.name} carries no licence text")
              classifiers = [
                  value.rsplit(" :: ", 1)[1]
                  for value in package.metadata.get_all("Classifier", [])
                  if value.startswith("License :: ")
              ]
              licence = package.metadata.get("License-Expression") or " / ".join(classifiers) or "see its licence text"
              source = f"https://pypi.org/project/{canonical}/{package.version}/#files"
              components.append((package.name, package.version, licence, source))
              texts += [(package.name, file.name, file.locate()) for file in files]

          lines = [
              "# Third-party notices",
              "",
              f"{name} {version} for {os.environ['OS']} is one executable that contains the project's own code, the"
              " Python runtime and the components below. Each component stays under its own licence; the texts that"
              " have to accompany the executable follow the list, as their authors published them.",
              "",
              f"The source code of this version is at https://github.com/{repository}/tree/v{version}. Its uv.lock pins"
              " every Python package to the version listed here, and each entry links to that version's source code.",
              "",
              "## Components",
              "",
          ]
          for component, number, licence, source in components:
              lines += [f"### {component}", "", f"- Version: {number}", f"- Licence: {licence}", f"- Source: {source}", ""]
          lines += ["## Licence texts", ""]
          for owner, filename, path in texts:
              lines += [f"### {owner} – {filename}", "", "````text", path.read_text("utf-8", "replace").strip(), "````", ""]
          Path(os.environ["NOTICES"]).write_text("\n".join(lines), encoding="utf-8", newline="\n")
          PY

      - name: Sign the executable
        if: ${{ inputs.version && runner.os == 'Windows' }}
        uses: GrzybDev/actions/codesign@v1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
        with:
          files: build/${{ steps.app.outputs.name }}${{ matrix.extension }}
          version: ${{ inputs.version }}
          store: ${{ vars.SIGNING_STORE || 's3://codesign' }}
          subject: ${{ vars.SIGNING_SUBJECT }}

      - name: Attach the executable and its notices to the release
        if: ${{ inputs.version }}
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/${{ steps.app.outputs.name }}${{ matrix.extension }}
            build/${{ steps.app.outputs.name }}_THIRD-PARTY-NOTICES.md
          tag_name: v${{ inputs.version }}
